name: Bump Hugo version

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest Hugo version
        id: latest
        run: |
          latest=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Read current pinned version
        id: current
        run: |
          current=$(cat .hugo-version)
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Check for existing bump PRs
        id: check
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # If there's already an open PR for the latest version, skip
          existing=$(gh pr list --head "bump-hugo-${LATEST}" --state open \
            --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "::notice::PR #${existing} already open for Hugo ${LATEST}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Close any open bump PRs for older versions
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bump-hugo-"))
                  | [.number, .headRefName] | @tsv' \
          | while IFS=$'\t' read -r num branch; do
              echo "::notice::Closing PR #${num} (${branch}), superseded by Hugo ${LATEST}"
              gh pr close "$num" --comment "Superseded by Hugo ${LATEST}."
              git push origin --delete "$branch" 2>/dev/null || true
            done

      - name: Bump if newer
        if: >-
          steps.latest.outputs.version != steps.current.outputs.version
          && steps.check.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          CURRENT: ${{ steps.current.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="bump-hugo-${LATEST}"
          git checkout -b "$branch"
          echo "${LATEST}" > .hugo-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump Hugo ${CURRENT} -> ${LATEST}"
          git push -u origin "$branch"
          gh pr create \
            --title "Bump Hugo ${CURRENT} -> ${LATEST}" \
            --body "Automated bump of pinned Hugo version in \`.hugo-version\`." \
            --base main
